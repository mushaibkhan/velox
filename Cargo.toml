[workspace]
resolver = "2"
members = [
    "crates/velox-core",
    "crates/velox-text-buffer",
    "crates/velox-syntax",
    "crates/velox-editor",
    "crates/velox-terminal",
    "crates/velox-workspace",
    "crates/velox-themes",
    "crates/velox-settings",
    "crates/velox-search",
    "crates/velox-git",
    "crates/velox-language-server",
    "crates/velox-app",
]

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
velox-core = { path = "crates/velox-core" }
velox-text-buffer = { path = "crates/velox-text-buffer" }
velox-syntax = { path = "crates/velox-syntax" }
velox-editor = { path = "crates/velox-editor" }
velox-terminal = { path = "crates/velox-terminal" }
velox-workspace = { path = "crates/velox-workspace" }
velox-themes = { path = "crates/velox-themes" }
velox-settings = { path = "crates/velox-settings" }
velox-search = { path = "crates/velox-search" }
velox-git = { path = "crates/velox-git" }
velox-language-server = { path = "crates/velox-language-server" }

ropey = "1.6"
portable-pty = "0.8"
vte = "0.14"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.29"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
parking_lot = "0.12"
walkdir = "2.5"
regex = "1.11"
rfd = "0.15"
thiserror = "2.0"
lsp-types = "0.97"
tokio = { version = "1.40", features = ["full"] }
