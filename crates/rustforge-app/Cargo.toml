[package]
name = "rustforge-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "rustforge_app"
path = "src/lib.rs"

[[bin]]
name = "rustforge"
path = "src/main.rs"

[dependencies]
rustforge-core.workspace = true
rustforge-text-buffer.workspace = true
rustforge-syntax.workspace = true
rustforge-editor.workspace = true
rustforge-terminal.workspace = true
rustforge-workspace.workspace = true
rustforge-themes.workspace = true
rustforge-settings.workspace = true
rustforge-search.workspace = true
rustforge-git.workspace = true

git2 = { version = "0.20", default-features = false }
eframe.workspace = true
egui.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rfd.workspace = true
parking_lot.workspace = true
serde.workspace = true

[dev-dependencies]
tempfile = "3"
